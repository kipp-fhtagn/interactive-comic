  <script>
    const coverTrack = document.querySelector('.cover-track');
    const coverStage = document.querySelector('.cover-stage');
    const emirTrack = document.querySelector('.emir-track');
    const emirStage = document.querySelector('.emir-stage');
    const emirPanel = document.querySelector('.emir-panel');
    const emirImage = emirPanel.querySelector('img');
    const title = document.querySelector('.title');
    const scrollCue = document.querySelector('.scroll-cue');
    const introCopy = document.querySelector('.intro-copy');
    const frame = document.querySelector('.frame');
    const scene = document.querySelector('.scene');
    const boy = document.querySelector('.boy');
    let scheduled = false;
    function render() {
      scrollCue.hidden = window.scrollY > 24;
      const mobile = window.innerWidth <= 760;
      const viewportWidth = window.innerWidth;
      const viewportHeight = scene.clientHeight;
      // Mobile has its own crop; the title and portrait use independent sizing.
      const mobileSceneWidth = Math.max(viewportWidth * 2, viewportHeight * 1.35);
      frame.style.width = mobile ? mobileSceneWidth + 'px' : '';
      frame.style.left = mobile ? -(mobileSceneWidth - viewportWidth) * .38 + 'px' : '';
      // Measure the final, untransformed frame to keep both layers aligned.
      const width = frame.offsetWidth;
      const height = frame.offsetHeight;
      const rect = { width, height, left: mobile ? -(width - viewportWidth) * .38 : (viewportWidth - width) / 2, top: viewportHeight - height };
      const originalStart = viewportHeight * (mobile ? .045 : .02);
      const start = originalStart + 100;
      const end = mobile ? start : Math.max(originalStart, rect.top + rect.height * .065);
      const distance = coverTrack.offsetHeight - coverStage.clientHeight;
      // Zoom finishes at 90% of the scenery arrival; scrolling ends with the cover.
      const chapter = Math.max(1, distance);
      const progress = Math.max(0, Math.min(1, window.scrollY / chapter));
      // Fade the supporting copy out in the first 22% of the approach.
      frame.classList.toggle('smoke-active', progress > .03 && coverTrack.getBoundingClientRect().bottom > 0 && !document.hidden);

      const boyProgress = Math.max(0, Math.min(1, window.scrollY / Math.max(1, chapter * .9)));
      const boyWidth = mobile ? Math.min(viewportWidth * 1.85, viewportHeight * 1.15) : width;
      const boyHeight = boyWidth * 4046 / 8000;
      // Leave the opening headline clear, including on shallow viewports.
      const titleSize = mobile ? viewportWidth * .094 : width * .085;
      const headlineBottom = start + titleSize * 1.08 + Math.max(18, viewportHeight * .025);
      // Size the visible head against the headline, rather than a width-based cap.
      // The PNG has a small transparent margin above the hair.
      title.style.top = start + 'px';
      title.style.left = (mobile ? viewportWidth * .04 : rect.left + rect.width * .15) + 'px';
      title.style.width = (mobile ? viewportWidth * .92 : rect.width * .79) + 'px';
      title.style.setProperty('--title-size', titleSize + 'px');
      title.style.transform = `translateY(${(end - start) * progress}px)`;
      const availableScale = Math.max(.2, (viewportHeight - headlineBottom) / (boyHeight * .973));
      const mobileHeadroom = Math.max(80, viewportHeight - start - title.offsetHeight - 18);
      const initialScale = mobile ? Math.min(mobileHeadroom / (boyHeight * .973), viewportWidth * .92 / (boyWidth * .35)) : availableScale;
      const originalScale = mobile ? Math.min((mobileHeadroom + 100) / (boyHeight * .973), viewportWidth * .92 / (boyWidth * .35)) : Math.max(.2, (viewportHeight - headlineBottom + 100) / (boyHeight * .973));
      const finalScale = originalScale * (mobile ? 1.30 : .96);
      boy.style.bottom = '0px';
      boy.style.transformOrigin = mobile ? '42.5% 100%' : '42% 100%';
      boy.style.left = (mobile ? viewportWidth * .5 - boyWidth * .425 : rect.left - width * .12) + 'px';
      boy.style.width = boyWidth + 'px';
      boy.style.height = boyHeight + 'px';
      boy.style.transform = `scale(${initialScale + (finalScale - initialScale) * boyProgress})`;
      // The complete drawing starts below the viewport and rises with scroll.
      const sceneOffset = window.innerHeight - rect.top + 24;
      scene.style.transform = `translateY(${sceneOffset * (1 - progress)}px)`;
      // Mobile buildings grow from the bottom, finishing before the scroll stop.
      const zoomProgress = Math.min(1, progress / .92);
      const sceneryScale = mobile ? 1 + .35 * zoomProgress * zoomProgress * (3 - 2 * zoomProgress) : 1;
      frame.style.transformOrigin = mobile ? `${viewportWidth * .5 - rect.left}px 100%` : '';
      frame.style.transform = mobile ? `scale(${sceneryScale})` : '';
      // Fade only as the approaching smoke reaches the supporting copy.
      const smokeTop = viewportHeight - height * sceneryScale + sceneOffset * (1 - progress);
      const copyBottom = introCopy.getBoundingClientRect().bottom - coverStage.getBoundingClientRect().top;
      const gap = smokeTop - copyBottom;
      const currentBoyScale = initialScale + (finalScale - initialScale) * boyProgress;
      const headGap = viewportHeight - boyHeight * currentBoyScale * .973 - copyBottom;
      const openingHeadGap = viewportHeight - boyHeight * initialScale * .973 - copyBottom;
      // Finish fading with clearance before either the head or smoke reaches the copy.
      const headFade = Math.max(0, Math.min(1, (openingHeadGap - headGap) / Math.max(1, openingHeadGap - 8)));
      const smokeFade = Math.max(0, Math.min(1, (140 - gap) / 116));
      const fade = mobile ? Math.max(headFade, smokeFade) : Math.max(0, Math.min(1, progress / .22));
      introCopy.style.opacity = 1 - fade * fade * (3 - 2 * fade);
      introCopy.style.visibility = fade >= 1 ? 'hidden' : 'visible';
      renderEmir(mobile);
      renderParents(mobile);
      renderSanad();
      renderPortraits();
      renderAftermath();
      renderRescuers();
      renderHospital();
      renderNewScenes();
      renderRafah();
      renderGazaFinal();
      renderBombsContinuation();
      renderPanelBorders();
      renderDialogue();
      scheduled = false;
      if (revealPending) { revealPending=false; update(); }
    }
    let emirProgress = 0;
    let emirLastScroll = window.scrollY;
    function renderEmir(mobile) {
      // Replay the same timeline backwards, with a shorter return journey.
      const currentScroll = window.scrollY;
      const sectionTop = emirTrack.getBoundingClientRect().top + currentScroll;
      const sectionEnd = sectionTop + emirTrack.offsetHeight - emirStage.clientHeight;
      if (currentScroll < emirLastScroll && emirLastScroll > sectionTop && currentScroll < sectionEnd) {
        const reverseDistance = Math.min(emirLastScroll, sectionEnd) - Math.max(currentScroll, sectionTop);
        if (reverseDistance > 0) {
          const target = Math.max(sectionTop, currentScroll - reverseDistance * 1.5);
          window.scrollTo({ top: target, behavior: "instant" });
        }
      }
      emirLastScroll = window.scrollY;
      const panelWidth = emirPanel.clientWidth;
      const travel = Math.max(1, emirTrack.offsetHeight - emirStage.clientHeight);
      emirProgress = Math.max(0, Math.min(1, -emirTrack.getBoundingClientRect().top / travel));
      const storyProgress = Math.min(1, emirProgress / .65);
      const streetProgress = Math.max(0, Math.min(1, (emirProgress - .67) / .33));
      const p = Math.min(1, storyProgress / .6);
      const pan = Math.max(0, Math.min(1, (storyProgress - .6) / .4));
      const panEase = pan * pan * (3 - 2 * pan);
      const captionProgress = Math.max(0, Math.min(1, (p - .04) / .72));
      const captionEase = captionProgress * captionProgress * (3 - 2 * captionProgress);
      const caption = emirStage.querySelector(".emir-intro");
      const textScale = Math.min(.42, innerWidth * .94 / 1921);
      document.querySelectorAll(".emir-intro, .emir-second, .tumama-caption, .wounded-caption, .parents-caption").forEach(box => { const image = box.querySelector("img"); if (image.naturalWidth) box.style.width = image.naturalWidth * textScale + "px"; });
      const captionWidth = 1584 * textScale;
      caption.style.width = captionWidth + "px";
      // Account for the white inset already present in the caption PNG.
      const captionLeft = (innerWidth - captionWidth) / 2 + captionWidth * .044;
      const leftMargin = mobile ? innerWidth * .044 : innerWidth * .035;
      emirStage.style.setProperty("--caption-slide", (leftMargin - captionLeft) * captionEase + "px");
      const eased = easyRange(p, 0, .72);
      const opening = reducedMotion.matches ? 1 : eased;

      track.querySelector('.amputated-overlay').style.opacity = fade * fade * (3 - 2 * fade);
      const panorama = document.querySelector('.bombed-track');
      const stage = panorama.firstElementChild;
      const img = stage.querySelector('img');
      const ratio = (img.naturalWidth || 6000) / (img.naturalHeight || 2745);
      // Keep a meaningful horizontal journey even on wide desktop displays.
      const height = Math.max(stage.clientHeight, stage.clientWidth * 1.45 / ratio);
      const width = height * ratio;
      const sequence = progress(panorama);
      const pan = clamp((sequence - .02) / .29);
      const ease = v => { v=clamp(v); return v*v*(3-2*v); };
      const arrival = ease((sequence-.33)/.16);
      const expand = ease((sequence-.52)/.20);
      const close = ease((sequence-.77)/.20);
      const mother = stage.querySelector('.mother-arrival');
      mother.style.transform = `translateX(${(1-arrival)*100}%)`;
      const window = mother.querySelector('.mother-window');
      const left = stage.clientWidth*.055*(1-expand), top=stage.clientHeight*.05*(1-expand);
      const fw=stage.clientWidth*(.78+.22*expand), fh=stage.clientHeight*(.80+.20*expand);
      window.style.left=left+'px'; window.style.top=top+'px';
      window.style.width=fw+'px'; window.style.height=fh+'px';
      window.style.clipPath="none";
      window.style.transform=`translateX(${-stage.clientWidth*close}px)`;
      fitOpening(window.querySelector('img'),fw,fh,expand,.64,.36+.04*expand,1.75);
      mother.querySelector('.children-window').style.transform=`translateX(${(1-close)*100}%)`;
      img.style.width = width + 'px'; img.style.height = height + 'px';
      img.style.top = (stage.clientHeight - height) * .5 + 'px';
      img.style.transform = `translate3d(${-(width - stage.clientWidth) * pan-stage.clientWidth*arrival}px, 0, 0)`;
    }
    function renderRescuers() {
      const track=document.querySelector('.rescuers-track'), stage=track.firstElementChild, img=stage.querySelector('img');
      const clamp=v=>Math.max(0,Math.min(1,v));
      const p=clamp(-track.getBoundingClientRect().top/(track.offsetHeight-stage.clientHeight));
      const ratio=(img.naturalWidth||6000)/(img.naturalHeight||2745);
      const baseHeight=Math.max(stage.clientHeight,stage.clientWidth*1.45/ratio), baseWidth=baseHeight*ratio;
      let opening=clamp((p-.04)/.43); opening=opening*opening*(3-2*opening);
      const zoom=1+1.5*(1-opening),height=baseHeight*zoom,width=baseWidth*zoom;
      const initialX=Math.min(0,Math.max(stage.clientWidth-width,stage.clientWidth*.5-width*.115));
      const initialY=Math.min(0,Math.max(stage.clientHeight-height,stage.clientHeight*.5-height*.80));
      const x=initialX*(1-opening)-(baseWidth-stage.clientWidth)*clamp((p-.53)/.43);
      const y=initialY*(1-opening)+(stage.clientHeight-baseHeight)*.5*opening;
      img.style.width=width+'px'; img.style.height=height+'px';img.style.top=y+'px';
      img.style.transform=`translateX(${x}px)`;
    }
    function renderDialogue() {
      const clamp = v => Math.max(0, Math.min(1, v));
      const smooth = v => { v = clamp(v); return v * v * (3 - 2 * v); };
      const timelines = [[.08,.25,.30],[.31,.51,.59],[.64,.74,.79],[.79,.87,.91],[.91,1.1,1.2],[.03,.36,.48],[.48,1.1,1.2]];
      const group = document.querySelector('.continuous-dialogue');
      const portraitStage = group.parentElement;
      const portraitTrack = portraitStage.parentElement;
      const pp = clamp(-portraitTrack.getBoundingClientRect().top / (portraitTrack.offsetHeight-portraitStage.clientHeight));
      const scale = Math.min(.36, portraitStage.clientWidth * .73 / 2440, portraitStage.clientHeight * .87 / 2120);
      group.style.width = 4342*scale+'px'; group.style.height = 3886*scale+'px';
      group.style.left = (portraitStage.clientWidth*.97-3990*scale)+'px';
      group.style.top = portraitStage.clientHeight*.045+'px';
      const regions = [[1550,0,900,1110],[1730,1100,1020,520],[2410,650,885,650],[2850,1110,1140,510],[2730,1600,850,850]];
      group.querySelectorAll('[data-continuous-text]').forEach(img => {
        const i=Number(img.dataset.continuousText), start=timelines[i-1][0];
        const alpha=soften("text-"+i,smooth((pp-start)/.065));
        img.style.opacity=alpha; img.setAttribute('aria-hidden',String(alpha<.01));
        const rect=group.querySelector('[data-reveal="'+i+'"]');
        const r=regions[i-1], reveal=soften("shape-"+i,clamp((pp-start-.015)/.065));
        rect.setAttribute('width',r[2]*(i>=3 ? reveal : 1));
        rect.setAttribute('height',r[3]*(i<3 ? reveal : 1));
      });
      document.querySelectorAll('.dialogue').forEach(box => {
        const i = Number(box.dataset.speech), stage = box.parentElement, track = stage.parentElement;
        const p = clamp(-track.getBoundingClientRect().top / Math.max(1, track.offsetHeight - stage.clientHeight));
        const [start, exit, end] = timelines[i-1];
        const alpha = soften("text-"+i,smooth((p-start)/.065) * (1-smooth((p-exit)/(end-exit))));
        const shape = box.querySelector('.dialogue-shape');
        const ratio = (shape.naturalHeight || 500)/(shape.naturalWidth || 800);
        const letteringScale = Math.min(.38, stage.clientWidth * .78 / 999, stage.clientHeight * .46 / 919);
        const width = (i === 6 ? 861 : (shape.naturalWidth || 845)) * letteringScale;
        box.style.width = width + 'px';
        box.style.left = (i <= 2 ? stage.clientWidth-width-stage.clientWidth*.035 : i <= 5 ? stage.clientWidth-width-stage.clientWidth*.025 : stage.clientWidth*.04) + 'px';
        box.style.top = (stage.clientHeight * (i===2 ? .40 : i===4 ? .39 : i===5 ? .61 : i===7 ? .40 : .055)) + 'px';
        box.style.opacity = 1-smooth((p-exit)/(end-exit));
        box.setAttribute('aria-hidden',String(alpha<.01));
        box.querySelector('.dialogue-text').style.opacity = alpha;
        const reveal = soften("shape-"+i,clamp((p-start-.015)/.065));
        const edge = reveal*103;
        const direction = i>=3 && i<=5 ? 'to right' : 'to bottom';
        shape.style.maskImage = reveal >= 1 ? 'none' : `linear-gradient(${direction}, black ${Math.max(0,edge-3)}%, transparent ${edge}%)`;
        if (i === 6) { shape.style.maskImage = 'none'; shape.style.clipPath = `inset(54% 0 26.8% ${(1-reveal)*100}%)`; }
        shape.style.opacity = reveal>0 ? 1 : 0;
      });
    }
    function update() { if (!scheduled) { scheduled = true; requestAnimationFrame(render); } }
    const mouseMotion = matchMedia('(hover: hover) and (pointer: fine)');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    function moveDust(x, y) {
      document.documentElement.style.setProperty("--text-mouse-x", x * -10 + "px");
      document.documentElement.style.setProperty("--text-mouse-y", y * -7 + "px");
      emirStage.style.setProperty('--caption-x', x * -10 + 'px');
      emirStage.style.setProperty('--caption-y', y * -7 + 'px');
      frame.style.setProperty('--dust-near-x', x * 16 + 'px');
      frame.style.setProperty('--dust-near-y', y * 10 + 'px');
      frame.style.setProperty('--dust-far-x', x * -9 + 'px');
      frame.style.setProperty('--dust-far-y', y * -6 + 'px');
    }
    addEventListener('pointermove', event => {
      if (!mouseMotion.matches || reducedMotion.matches || event.pointerType !== 'mouse') return;
      moveDust(event.clientX / innerWidth * 2 - 1, event.clientY / innerHeight * 2 - 1);
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => moveDust(0, 0));
    addEventListener('blur', () => moveDust(0, 0));
    document.addEventListener('visibilitychange', update);
    addEventListener('scroll', update, { passive: true });
    addEventListener('resize', update);
    emirImage.addEventListener('load', update);
    document.querySelectorAll('.children-nine-stage img, .children-ten-panel img, .bombed-two-stage img, .after-bombs-panel img, .portrait-panel img, .bombed-stage img, .rescuers-stage img, .dialogue-shape, .departure-layer img, .focus-stage img, .skyline-stage img, .rafah-track img, .gaza-final-track img, .gaza-playground-track img').forEach(img => img.addEventListener('load', update));
    reducedMotion.addEventListener('change', update);

    const creditsBand = document.querySelector('.story-credits-band');
    const creditsObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        creditsBand.classList.toggle('is-visible', entry.isIntersecting);
      });
    }, { threshold: .35 });
    creditsObserver.observe(creditsBand);
    render();
  </script>
</body>
